
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthAssist AI - Premium Medical Guidance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        /* Replicating the image's vibrant yet soft gradient background */
        background: 
          radial-gradient(circle at 0% 0%, rgba(254, 215, 170, 0.4) 0%, transparent 40%),
          radial-gradient(circle at 100% 0%, rgba(221, 214, 254, 0.4) 0%, transparent 40%),
          radial-gradient(circle at 100% 100%, rgba(191, 219, 254, 0.4) 0%, transparent 40%),
          radial-gradient(circle at 0% 100%, rgba(254, 226, 226, 0.4) 0%, transparent 40%),
          #ffffff;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
      }
      .grid-pattern {
        background-image: radial-gradient(#e2e8f0 0.8px, transparent 0.8px);
        background-size: 32px 32px;
        opacity: 0.4;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(0,0,0,0.05);
        border-radius: 10px;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.04);
      }
      .gradient-pill-button {
        position: relative;
        background: white;
        padding: 1px;
        border-radius: 9999px;
        display: inline-block;
        transition: transform 0.2s ease;
      }
      .gradient-pill-button::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border-radius: 9999px;
        padding: 2px;
        background: linear-gradient(to right, #8b5cf6, #fcd34d);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes soft-pulse {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
      }
      .glow-blob {
        position: absolute;
        filter: blur(80px);
        border-radius: 100%;
        z-index: -1;
        animation: soft-pulse 8s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="antialiased text-slate-900">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
